name: my_portfolio
description: "Makarios Fared | Flutter Developer Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  dartz: ^0.10.1
  equatable: ^2.0.8
  internet_connection_checker: ^3.0.1
  google_fonts: ^8.0.1
  shared_preferences: ^2.5.4
  pretty_dio_logger: ^1.4.0
  url_launcher: ^6.3.2
  animate_do: ^4.2.0
  intl: ^0.20.2
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  visibility_detector: ^0.4.0+2
  device_preview: ^1.3.1
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/my_cv.pdf
